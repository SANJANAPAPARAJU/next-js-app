name: Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build: #   //build is just a name for the job, it can be anything you want/
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4 #checkout action is used to check out the code from the repository so that it can be used in the workflow.
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3 #setup-node action is used to set up the Node.js environment for the workflow. It allows you to specify the version of Node.js you want to use and also provides caching for npm dependencies.
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: "Installing Dependencies"
        run: npm i

      - name: "Build command"
        run: npm run build # all these commands are defined in the package.json file, you can run them using npm run <command-name>

  unit-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: "Installing Dependencies"
        run: npm i

      - name: "Running test cases"
        run: npm run test
